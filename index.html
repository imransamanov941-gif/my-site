<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Имран молодец нафик</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Выстраивает элементы вертикально друг за другом */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        h1 {
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif; /* Шрифт для первой строчки */
            font-size: 5vw;
            text-transform: uppercase;
            color: #333;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            font-size: 3vw;
            color: #555;
            font-family: "Courier New", monospace;
            margin: 0;
        }
        /* Стили для управления размером фото */
        .my-photo {
            max-width: 1024px; /* Максимальная ширина картинки на экране */
            width: 80%;        /* Адаптивность для мобильных устройств */
            height: auto;      /* Сохранение пропорций */
            border-radius: 12px; /* Красивые закругленные углы */
            margin-bottom: 20px; /* Отступ до нижней строчки */
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); /* Мягкая тень под фото */
        }
    </style>
</head>
<body>
    <h1>нада поебаться и поехать<br>в канаду</h1>
    
    <!-- Ваше фото между строчками -->
    <img src="photo.jpg" alt="Мое фото" class="my-photo">
    
    <h2>саид лох</h2>
</body>
</html>
